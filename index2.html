<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Закладки из fill.js</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101318; color: #e7ecf3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 4vw, 48px); border-bottom: 1px solid #293140; background: #151a22; }
    h1 { margin: 0 0 6px; font-size: clamp(1.25rem, 2.5vw, 1.8rem); }
    #status { margin: 0; color: #aab6c8; font-size: .93rem; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, 23vw); gap: 18px; padding: 18px clamp(16px, 4vw, 48px) 32px; }
    .toolbar, .similar { background: #171d27; border: 1px solid #2b3545; border-radius: 10px; }
    .toolbar { padding: 12px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
    #search { width: 100%; min-width: 0; border: 1px solid #42516a; border-radius: 7px; padding: 10px 12px; background: #0e131b; color: inherit; font: inherit; }
    #search:focus { outline: 2px solid #56a8ff; outline-offset: 1px; }
    #clear { border: 1px solid #42516a; border-radius: 7px; padding: 9px 12px; background: #252f40; color: inherit; cursor: pointer; white-space: nowrap; }
    .theme-toggle { border: 1px solid #42516a; border-radius: 7px; padding: 9px 12px; background: #252f40; color: inherit; cursor: pointer; white-space: nowrap; }
    .theme-toggle:hover { background: #33445f; }
    #table { border-radius: 10px; overflow: hidden; }
    .similar { min-width: 0; padding: 16px; height: fit-content; position: sticky; top: 16px; }
    .similar h2 { margin: 0 0 8px; font-size: 1.05rem; }
    .hint { margin: 0; color: #aab6c8; line-height: 1.45; font-size: .92rem; }
    .similar-list { min-width: 0; list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
    .similar-list li { min-width: 0; }
    .similar-list a { display: block; width: 100%; min-width: 0; overflow-wrap: anywhere; text-align: left; border: 1px solid #334156; border-radius: 7px; padding: 8px 9px; background: #111722; color: inherit; cursor: pointer; font-size: .86rem; text-decoration: none; }
    .similar-list a:hover { background: #202b3d; border-color: #5e88b7; }
    .similar-list .similar-url { color: #7f8da3; font-size: .72rem; font-weight: 400; }
    .similar-list .similar-description { color: #aab6c8; display: block; margin-top: 3px; font-size: .8rem; line-height: 1.35; }
    .tabulator { border: 1px solid #2b3545; background: #10151e; font-size: .9rem; }
    .tabulator .tabulator-header { background: #1b2330; border-bottom-color: #2b3545; }
    .tabulator .tabulator-row { background: #10151e; border-bottom-color: #222c3b; }
    .tabulator .tabulator-row.tabulator-row-even { background: #141b26; }
    .tabulator .tabulator-row:hover { background: #1d2939; }
    .tabulator .tabulator-tableholder .tabulator-cell { white-space: normal; line-height: 1.35; }
    .bookmark-table { width: 100%; border: 1px solid #2b3545; border-radius: 10px; border-collapse: separate; border-spacing: 0; table-layout: fixed; overflow: hidden; background: #10151e; font-size: .9rem; }
    .bookmark-table th { padding: 9px 7px; border-bottom: 1px solid #2b3545; background: #1b2330; text-align: left; }
    .bookmark-table td { padding: 6px 7px; border-bottom: 1px solid #222c3b; line-height: 1.35; vertical-align: middle; white-space: normal; overflow-wrap: anywhere; }
    .bookmark-table tr:last-child td { border-bottom: 0; }
    .bookmark-table tr:nth-child(even) { background: #141b26; }
    .bookmark-table tr:hover { background: #1d2939; }
    .bookmark-table .date-column { width: 84px; text-align: center; white-space: nowrap; }
    .bookmark-sort { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 5px; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; font-weight: 600; text-align: left; cursor: pointer; }
    .bookmark-sort::after { content: attr(data-sort-indicator); color: #aab6c8; font-size: .75em; }
    .bookmark-empty { padding: 18px; color: #aab6c8; text-align: center; }
    .cell-clamp { display: -webkit-box; width: 100%; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
    .tags-inline { white-space: normal; }
    .site-inline { display: block; width: 100%; max-height: calc(5 * 1.35em + 2px); overflow: hidden; }
    .site-inline .tag-button { vertical-align: baseline; }
    .description-more { display: none; }
    .description-more[hidden] { display: none; }
    :root[data-theme="light"] { color-scheme: light; background: #f4f7fb; color: #182233; }
    :root[data-theme="light"] header { border-color: #ccd7e5; background: #ffffff; color: #182233; }
    :root[data-theme="light"] header h1 { color: #142238; }
    :root[data-theme="light"] #status, :root[data-theme="light"] .hint, :root[data-theme="light"] .similar-description { color: #41526a; }
    :root[data-theme="light"] .toolbar, :root[data-theme="light"] .similar { border-color: #ccd7e5; background: #ffffff; }
    :root[data-theme="light"] #search { border-color: #9eafc4; background: #f9fbfe; color: #182233; }
    :root[data-theme="light"] #clear, :root[data-theme="light"] .theme-toggle { border-color: #9eafc4; background: #e8eef6; color: #182233; }
    :root[data-theme="light"] .theme-toggle:hover { background: #dae5f2; }
    :root[data-theme="light"] .tabulator { border-color: #ccd7e5; background: #ffffff; color: #182233; }
    :root[data-theme="light"] .bookmark-table { border-color: #ccd7e5; background: #ffffff; color: #182233; }
    :root[data-theme="light"] .bookmark-table th { border-color: #ccd7e5; background: #eef4fa; color: #182233; }
    :root[data-theme="light"] .bookmark-table td { border-color: #e0e7f0; }
    :root[data-theme="light"] .bookmark-table tr:nth-child(even) { background: #f7f9fc; }
    :root[data-theme="light"] .bookmark-table tr:hover { background: #e9f3ff; }
    :root[data-theme="light"] .bookmark-sort::after, :root[data-theme="light"] .bookmark-empty { color: #41526a; }
    :root[data-theme="light"] .tabulator .tabulator-header { border-bottom-color: #ccd7e5; background: #eaf0f7; color: #182233; }
    :root[data-theme="light"] .tabulator .tabulator-header .tabulator-col { border-right-color: #ccd7e5; background: #eef4fa; color: #182233; }
    :root[data-theme="light"] .tabulator .tabulator-header .tabulator-col.tabulator-sortable:hover { background: #ddeaf6; }
    :root[data-theme="light"] .tabulator .tabulator-row { border-bottom-color: #e0e7f0; background: #ffffff; color: #182233; }
    :root[data-theme="light"] .tabulator .tabulator-row.tabulator-row-even { background: #f7f9fc; }
    :root[data-theme="light"] .tabulator .tabulator-row:hover { background: #e9f3ff; }
    :root[data-theme="light"] .similar-list a { border-color: #c4d1e1; background: #f8fbff; color: #182233; }
    :root[data-theme="light"] .similar-list a:hover { border-color: #6c9ed0; background: #e9f3ff; }
    :root[data-theme="light"] .tag-button { border-color: #86ad91; background: #e7f4e8; color: #205b2a; }
    :root[data-theme="light"] .tag-button:hover, :root[data-theme="light"] .tag-button:focus-visible { border-color: #4d9860; background: #d7edda; }
    :root[data-theme="light"] .description-more { color: #174f86; }
    :root[data-theme="light"] .url { color: #174f86; }
    :root[data-theme="light"] .url:hover { color: #0b3762; }
    .url { color: #6bb6ff; text-decoration: none; }
    .url:hover { text-decoration: underline; }
    .tag-button { border: 1px solid #3c714b; border-radius: 999px; padding: 2px 7px; margin: 2px 3px 2px 0; background: #1a3423; color: #b9e9bc; font: inherit; font-size: .83rem; cursor: pointer; }
    .tag-button:hover, .tag-button:focus-visible { background: #285236; border-color: #7ac985; outline: none; }
    @media (min-width: 901px) {
      header { padding-right: calc(max(290px, 23vw) + clamp(16px, 4vw, 48px) + 18px); }
      .similar {
        position: fixed;
        z-index: 10;
        top: 0;
        right: 0;
        width: calc(max(290px, 23vw) + clamp(16px, 4vw, 48px));
        height: fit-content;
        max-height: 100vh;
        overflow-y: auto;
        border-radius: 0 0 0 10px;
      }
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .similar { position: static; order: -1; }
      .site-inline { position: relative; max-height: calc(7 * 1.3em + 2px); overflow-wrap: anywhere; }
      .site-inline.has-more { padding-bottom: 2em; }
      .site-inline.is-expanded { max-height: none; padding-bottom: 0; overflow: visible; }
      .description-more { display: inline-block; position: absolute; right: 0; bottom: 0; padding: 4px 8px; border: 0; border-radius: 4px; background: transparent; color: #6bb6ff; font: inherit; font-size: .8rem; text-decoration: underline; cursor: pointer; }
      .site-inline.is-expanded .description-more { position: static; float: right; margin-top: 5px; }
    }
    @media (max-width: 600px) {
      header { align-items: flex-start; gap: 8px; padding: 12px; }
      header > div { min-width: 0; }
      h1 { margin-bottom: 4px; font-size: 1.15rem; }
      #status { font-size: .78rem; line-height: 1.3; }
      .theme-toggle { flex: 0 0 auto; padding: 7px 9px; font-size: .8rem; }
      main { gap: 10px; padding: 10px 12px 20px; }
      .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; padding: 8px; margin-bottom: 10px; }
      .toolbar label { grid-column: 1 / -1; font-size: .82rem; }
      #search { padding: 8px 9px; font-size: .88rem; }
      #clear { padding: 8px 10px; font-size: .8rem; }
      .similar { max-height: 25vh; max-height: 25dvh; overflow-y: auto; padding: 11px; border-radius: 8px; }
      .similar h2 { margin-bottom: 5px; font-size: .95rem; }
      .hint { font-size: .8rem; line-height: 1.35; }
      .similar-list { gap: 6px; margin-top: 8px; }
      .similar-list a { padding: 7px 8px; font-size: .8rem; }
      .similar-list .similar-url { font-size: .67rem; }
      .similar-list .similar-description { margin-top: 2px; font-size: .74rem; line-height: 1.3; }
      .tabulator { font-size: .78rem; }
      .bookmark-table { font-size: .78rem; }
      .bookmark-table th { padding: 7px; }
      .tabulator .tabulator-cell { padding: 6px 7px; }
      .bookmark-table td { padding: 6px 7px; }
      .tag-button { padding: 1px 5px; margin: 1px 2px 1px 0; font-size: .75rem; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Закладки</h1>
      <p id="status">Импортируется fill.js…</p>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Дневная тема</button>
  </header>
  <main>
    <section aria-label="Таблица закладок">
      <div class="toolbar">
        <label for="search">Поиск:</label>
        <input id="search" type="search" autocomplete="off" placeholder="URL, название, описание или тег">
        <button id="clear" type="button">Сбросить</button>
      </div>
      <div id="table"></div>
    </section>
    <aside class="similar" aria-live="polite">
      <h2>Похожие записи</h2>
      <p id="similar-hint" class="hint">Нажмите на строку, чтобы найти до 10 похожих записей.</p>
      <ol id="similar-list" class="similar-list"></ol>
    </aside>
  </main>

  <!-- fill.js исполняется как обычный JavaScript и вызывает LinkT для каждой записи. -->
  <script>
    window.bookmarkRows = [];
    window.LinkT = function (url, date, tags, title, description) {
      window.bookmarkRows.push({
        id: window.bookmarkRows.length + 1,
        url: String(url ?? ""),
        date: String(date ?? ""),
        tags: String(tags ?? ""),
        title: String(title ?? ""),
        description: String(description ?? "")
      });
    };
  </script>
  <script src="snowball.babel.min.js"></script>
  <script src="bookmark-search.js"></script>
  <script>
    function initViewer(sourceLabel) {
      const rows = window.bookmarkRows;
      const status = document.getElementById("status");
      const search = document.getElementById("search");
      const clear = document.getElementById("clear");
      const similarHint = document.getElementById("similar-hint");
      const similarList = document.getElementById("similar-list");

      if (!rows.length) {
        status.textContent = `${sourceLabel} не загрузился или не содержит записей LinkT().`;
        return;
      }

      const searchIndex = new BookmarkSearch(rows);
      let searchRanks = new Map();
      let sortBeforeSearch = null;
      const tableElement = document.getElementById("table");
      const useNativeTable = window.matchMedia("(max-width: 600px)").matches;
      const mobileDescriptions = window.matchMedia("(max-width: 900px)").matches;
      const pendingDescriptions = new Set();
      let descriptionFrame = 0;

      function showMoreButton(content) {
        content.classList.add("has-more");
        if (content.querySelector(".description-more")) return;
        const button = document.createElement("button");
        button.className = "description-more";
        button.type = "button";
        button.textContent = "Ещё";
        button.setAttribute("aria-expanded", "false");
        content.append(button);
        if (!table.isNative) table.getRow(Number(content.dataset.rowId))?.normalizeHeight();
      }

      function checkDescriptionOverflow(contents) {
        const checks = contents.filter(content => content.isConnected && content.dataset.moreChecked !== "true")
          .map(content => ({ content, overflowing: content.scrollHeight > content.clientHeight + 1 }));
        for (const { content, overflowing } of checks) {
          content.dataset.moreChecked = "true";
          if (overflowing) showMoreButton(content);
        }
      }

      const descriptionObserver = mobileDescriptions && "IntersectionObserver" in window
        ? new IntersectionObserver(entries => {
          checkDescriptionOverflow(entries.filter(entry => entry.isIntersecting).map(entry => entry.target));
        }, { rootMargin: "300px 0px" })
        : null;

      function watchDescriptionNode(node) {
        if (!mobileDescriptions || node.nodeType !== Node.ELEMENT_NODE) return;
        if (node.matches(".site-inline")) {
          if (descriptionObserver) {
            descriptionObserver.observe(node);
          } else {
            pendingDescriptions.add(node);
            if (!descriptionFrame) descriptionFrame = requestAnimationFrame(() => {
              descriptionFrame = 0;
              checkDescriptionOverflow([...pendingDescriptions]);
              pendingDescriptions.clear();
            });
          }
        }
        for (const content of node.querySelectorAll(".site-inline")) watchDescriptionNode(content);
      }

      const descriptionMutations = mobileDescriptions
        ? new MutationObserver(records => {
          for (const record of records) for (const node of record.addedNodes) watchDescriptionNode(node);
        })
        : null;
      if (descriptionMutations) descriptionMutations.observe(tableElement, { childList: true, subtree: true });

      const table = useNativeTable
        ? createMobileTable()
        : new Tabulator("#table", {
          data: rows,
          layout: "fitColumns",
          height: "calc(100vh - 160px)",
          virtualDom: true,
          index: "id",
          columnDefaults: { vertAlign: "middle" },
          initialSort: [{ column: "date", dir: "desc" }],
          columns: [
            { field: "searchRank", visible: false, sorter: (_a, _b, aRow, bRow) =>
              (searchRanks.get(aRow.getData().id) ?? Infinity) - (searchRanks.get(bRow.getData().id) ?? Infinity) },
            { title: "Сайт", field: "title", minWidth: 180, widthGrow: 1, headerSort: true, formatter: siteFormatter, tooltip: true, variableHeight: true },
            { title: "Дата", field: "date", width: 84, hozAlign: "center", headerSort: true }
          ]
        });

      tableElement.addEventListener("click", event => {
        const sortButton = event.target.closest(".bookmark-sort");
        if (sortButton && table.isNative) {
          event.stopPropagation();
          const current = table.getSorters()[0];
          const dir = current.field === sortButton.dataset.sortField && current.dir === "asc" ? "desc" : "asc";
          table.setSort(sortButton.dataset.sortField, dir);
          return;
        }
        const button = event.target.closest(".tag-button, .description-more");
        if (!button) return;
        event.stopPropagation();
        if (button.classList.contains("tag-button")) {
          search.value = button.dataset.tag;
          applySearch();
          search.focus();
          return;
        }
        const content = button.closest(".site-inline");
        const expanded = content.classList.toggle("is-expanded");
        button.textContent = expanded ? "Свернуть" : "Ещё";
        button.setAttribute("aria-expanded", String(expanded));
        requestAnimationFrame(() => {
          if (!table.isNative && content.closest(".tabulator-row")) table.getRow(Number(content.dataset.rowId))?.normalizeHeight();
        });
      }, true);

      table.on("rowClick", (_event, row) => showSimilar(row.getData()));
      table.on("rowMouseEnter", (_event, row) => showSimilar(row.getData()));

      if (window.matchMedia("(min-width: 901px)").matches) {
        const similarPanel = similarList.closest(".similar");
        const leftPane = tableElement.closest("section");
        let panelHeightFrame = 0;
        const syncPanelHeight = () => {
          if (panelHeightFrame) return;
          panelHeightFrame = requestAnimationFrame(() => {
            panelHeightFrame = 0;
            const leftPaneBottom = leftPane.getBoundingClientRect().bottom;
            const panelHeight = Math.max(0, Math.min(leftPaneBottom, window.innerHeight));
            similarPanel.style.height = `${panelHeight}px`;
            similarPanel.style.maxHeight = `${panelHeight}px`;
          });
        };
        if ("ResizeObserver" in window) new ResizeObserver(syncPanelHeight).observe(leftPane);
        window.addEventListener("resize", syncPanelHeight, { passive: true });
        window.addEventListener("scroll", syncPanelHeight, { passive: true });
        syncPanelHeight();
      }

      status.textContent = `Импортировано записей: ${rows.length} (${sourceLabel}). Сортируйте кликом по заголовкам; поиск работает по всем полям.`;

      let timer;
      let shownSimilarId = null;
      search.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(applySearch, 90);
      });
      clear.addEventListener("click", () => {
        search.value = "";
        applySearch();
      });

      const queryFromAddress = readHashQuery();
      if (queryFromAddress) {
        search.value = queryFromAddress;
        table.on("tableBuilt", () => applySearch());
      }

      function applySearch(updateAddress = true) {
        const query = search.value.trim();
        if (updateAddress) writeHashQuery(query);
        if (!query) {
          table.clearFilter(!(table.isNative && sortBeforeSearch !== null));
          if (sortBeforeSearch !== null) {
            table.setSort(sortBeforeSearch);
            sortBeforeSearch = null;
          }
          status.textContent = `Импортировано записей: ${rows.length} (${sourceLabel}). Фильтр сброшен.`;
          return;
        }
        if (sortBeforeSearch === null) {
          sortBeforeSearch = table.getSorters().map(sort => ({ column: sort.field, dir: sort.dir }));
        }
        const results = searchIndex.search(query);
        searchRanks = new Map(results.map((result, position) => [result.item.id, position]));
        const ids = new Set(searchRanks.keys());
        table.setFilter(data => ids.has(data.id), !table.isNative);
        table.setSort("searchRank", "asc");
        status.textContent = `Найдено: ${ids.size} из ${rows.length}. Поиск: «${query}». По релевантности.`;
      }

      function readHashQuery() {
        try {
          return decodeURIComponent(window.location.hash.slice(1));
        } catch {
          return window.location.hash.slice(1);
        }
      }

      function writeHashQuery(query) {
        const hash = query ? `#${encodeURIComponent(query)}` : "";
        window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}${hash}`);
      }

      function showSimilar(selected) {
        if (shownSimilarId === selected.id) return;
        shownSimilarId = selected.id;
        const matches = findSimilar(selected);
        similarList.replaceChildren();
        similarHint.textContent = matches.length
          ? `Похожие на «${selected.title}» (по названию, тегам и описанию):`
          : `Для «${selected.title}» похожих записей не найдено.`;
        for (const result of matches) {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = result.item.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          const title = document.createElement("strong");
          title.textContent = result.item.title || result.item.url;
          const url = document.createElement("span");
          url.className = "similar-url";
          url.textContent = ` (${result.item.url})`;
          const description = document.createElement("span");
          description.className = "similar-description";
          description.textContent = result.item.description || result.item.tags;
          link.append(title, url, description);
          item.append(link);
          similarList.append(item);
        }
      }

      function findSimilar(selected) {
        return searchIndex.similar(selected);
      }

      function siteFormatter(cell) {
        const data = cell.getRow().getData();
        return siteMarkup(data, cell.getValue());
      }

      function siteMarkup(data, value = data.title) {
        const url = String(data.url ?? "");
        const safeUrl = escapeHtml(url);
        const title = escapeHtml(value || url);
        const description = escapeHtml(data.description);
        const tags = String(data.tags ?? "").split(",").map(tag => tag.trim()).filter(Boolean)
          .map(tag => `<button type="button" class="tag-button" data-tag="${escapeHtml(tag)}" title="Искать: ${escapeHtml(tag)}">${escapeHtml(tag)}</button>`)
          .join(" ");
        return `<span class="site-inline" data-row-id="${escapeHtml(data.id)}"><a class="url" href="${safeUrl}" target="_blank" rel="noopener noreferrer">${title}</a> (<a class="url" href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a>): ${description} <span class="tags-inline">${tags}</span></span>`;
      }

      function createMobileTable() {
        tableElement.innerHTML = `<table class="bookmark-table"><thead><tr><th><button class="bookmark-sort" type="button" data-sort-field="title" data-sort-indicator="↕">Сайт</button></th><th class="date-column"><button class="bookmark-sort" type="button" data-sort-field="date" data-sort-indicator="↓">Дата</button></th></tr></thead><tbody></tbody></table>`;
        const body = tableElement.querySelector("tbody");
        let filteredRows = rows.slice();
        let sorter = { field: "date", dir: "desc" };

        function render() {
          const displayed = filteredRows.slice().sort((a, b) => {
            const comparison = sorter.field === "searchRank"
              ? (searchRanks.get(a.id) ?? Infinity) - (searchRanks.get(b.id) ?? Infinity)
              : String(a[sorter.field] ?? "").localeCompare(String(b[sorter.field] ?? ""), "ru");
            return (sorter.dir === "desc" ? -comparison : comparison) || a.id - b.id;
          });
          if (descriptionObserver) descriptionObserver.disconnect();
          pendingDescriptions.clear();
          body.innerHTML = displayed.length
            ? displayed.map(data => `<tr data-row-id="${data.id}"><td>${siteMarkup(data)}</td><td class="date-column">${escapeHtml(data.date)}</td></tr>`).join("")
            : `<tr><td class="bookmark-empty" colspan="2">Ничего не найдено</td></tr>`;
          for (const button of tableElement.querySelectorAll(".bookmark-sort")) {
            const active = button.dataset.sortField === sorter.field;
            button.dataset.sortIndicator = active ? (sorter.dir === "asc" ? "↑" : "↓") : "↕";
            button.setAttribute("aria-sort", active ? (sorter.dir === "asc" ? "ascending" : "descending") : "none");
          }
        }

        const nativeTable = {
          isNative: true,
          clearFilter(redraw = true) { filteredRows = rows.slice(); if (redraw) render(); },
          setFilter(predicate, redraw = true) { filteredRows = rows.filter(data => predicate(data)); if (redraw) render(); },
          getSorters() { return [{ field: sorter.field, dir: sorter.dir }]; },
          setSort(sort, dir, redraw = true) {
            const value = Array.isArray(sort) ? sort[0] : { column: sort, dir };
            sorter = { field: value?.field ?? value?.column ?? "date", dir: value?.dir ?? "desc" };
            if (redraw) render();
          },
          on(name, callback) {
            if (name === "tableBuilt") {
              queueMicrotask(callback);
              return;
            }
            const eventName = name === "rowMouseEnter" ? "mouseover" : "click";
            tableElement.addEventListener(eventName, event => {
              const element = event.target.closest("tr[data-row-id]");
              if (!element) return;
              if (name === "rowMouseEnter" && element.contains(event.relatedTarget)) return;
              const data = rows.find(row => row.id === Number(element.dataset.rowId));
              if (data) callback(event, { getData: () => data });
            });
          }
        };
        render();
        return nativeTable;
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
      }
    }

    const themeToggle = document.getElementById("theme-toggle");

    function applyTheme(theme) {
      const isLight = theme === "light";
      document.documentElement.dataset.theme = isLight ? "light" : "dark";
      themeToggle.textContent = isLight ? "Ночная тема" : "Дневная тема";
      themeToggle.setAttribute("aria-pressed", String(isLight));
    }

    function readSavedTheme() {
      try {
        const saved = window.localStorage.getItem("fill-viewer-theme");
        return saved === "light" || saved === "dark" ? saved : "dark";
      } catch {
        return "dark";
      }
    }

    applyTheme(readSavedTheme());
    themeToggle.addEventListener("click", () => {
      const nextTheme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      applyTheme(nextTheme);
      try {
        window.localStorage.setItem("fill-viewer-theme", nextTheme);
      } catch {
        // Браузер может запрещать localStorage для file://; тема всё равно сменится до обновления страницы.
      }
    });

    function loadScript(source) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = source;
        script.async = false;
        script.onload = () => resolve(source);
        script.onerror = () => {
          script.remove();
          reject(new Error(`Не удалось загрузить ${source}`));
        };
        document.head.append(script);
      });
    }

    function loadStylesheet(source) {
      return new Promise(resolve => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = source;
        link.onload = resolve;
        link.onerror = resolve;
        document.head.append(link);
      });
    }

    async function importBookmarks() {
      const remote = "https://imageman.github.io/Public/fill.js";
      try {
        await loadScript(remote);
        if (!window.bookmarkRows.length) throw new Error("Удалённый fill.js не содержит LinkT().");
        return remote;
      } catch {
        window.bookmarkRows = [];
        await loadScript("fill.js");
        if (!window.bookmarkRows.length) throw new Error("Локальный fill.js не содержит LinkT().");
        return "локальный fill.js";
      }
    }

    (async () => {
      const status = document.getElementById("status");
      try {
        const sourceLabel = await importBookmarks();
        if (!window.matchMedia("(max-width: 600px)").matches) {
          await Promise.all([
            loadStylesheet("https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/css/tabulator_midnight.min.css"),
            loadScript("https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js")
          ]);
        }
        initViewer(sourceLabel);
      } catch (error) {
        status.textContent = `Не удалось загрузить данные или таблицу: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
